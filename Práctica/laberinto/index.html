<!DOCTYPE html>

<html>

<head>
    <title>Mi Juego Laberinto</title>
    <meta charset="utf-8">

    <script type="text/javascript" src="../libs/jquery.js"></script>

    <script type="importmap">
    { 
        "imports": { 
            "three"     : "../libs/three.module.js",
            "gui"       : "../libs/dat.gui.module.js",
            "trackball" : "../libs/TrackballControls.js" 
        } 
    }
    </script>

    <script type="module" src="./MyScene.js"></script>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background: black;
        }

        /* Aquí va Three.js */
        #WebGL-output {
            width: 100vw;
            height: 100vh;
        }

        /* Interfaz encima del juego */
        #hud {
            position: fixed;
            inset: 0;
            z-index: 10;
            color: white;
            pointer-events: none;
        }

        /* Hueso arriba a la izquierda */
        #contador-huesos {
            position: fixed;
            top: 10px;
            left: 25px;

            display: flex;
            align-items: center;
            gap: 18px;
        }

        #contador-huesos img {
            width: 100px;
            height: 100px;
            object-fit: contain;
        }

        #contador-huesos strong {
            font-size: 90px;
            line-height: 1;
            color: white;
            text-shadow: 0 0 10px black;
        }

        #pickup-llave,
        #pickup-reloj,
        #pickup-pocion {
            display: none;
        }

        /* Barra inferior de pickups */
        #barra-pickups {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);

            display: flex;
            gap: 35px;

            background: rgba(0, 0, 0, 0.45);
            padding: 12px 25px;
        }

        /* Cada pickup */
        .pickup {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .pickup img {
            width: 70px;
            height: 70px;
            object-fit: contain;
        }

        .pickup strong {
            font-size: 36px;
            color: white;
            text-shadow: 0 0 8px black;
        }

        /* Temporizador abajo izquierda */
        #temporizador {
            position: fixed;
            bottom: 25px;
            left: 25px;

            background: rgba(0, 0, 0, 0.65);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 10px;

            padding: 12px 20px;

            color: white;
            font-size: 34px;
            font-weight: bold;
            text-shadow: 0 0 8px black;

            z-index: 20;
        }

        #temporizador.tiempo-agotado {
            color: red;
        }

        /* Pantalla de partida acabada */
        #pantalla-game-over {
            position: fixed;
            inset: 0;

            display: none;
            align-items: center;
            justify-content: center;

            background: rgba(0, 0, 0, 0.88);
            z-index: 100;

            pointer-events: auto;
        }

        #pantalla-game-over.visible {
            display: flex;
        }

        #caja-game-over {
            text-align: center;
            color: white;

            background: rgba(20, 20, 20, 0.95);
            border: 2px solid red;
            border-radius: 18px;

            padding: 45px 60px;
            box-shadow: 0 0 35px rgba(255, 0, 0, 0.55);
        }

        #caja-game-over h1 {
            margin: 0 0 20px 0;
            font-size: 52px;
            color: red;
            letter-spacing: 3px;
            text-shadow: 0 0 12px black;
        }

        #caja-game-over p {
            font-size: 24px;
            margin-bottom: 35px;
        }

        #btn-reintentar {
            padding: 15px 35px;

            border: none;
            border-radius: 10px;

            background: red;
            color: white;

            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
        }

        #btn-reintentar:hover {
            background: darkred;
        }

        /* Pantalla de pausa */
        #pantalla-pausa {
            position: fixed;
            inset: 0;

            display: none;
            align-items: center;
            justify-content: center;

            background: rgba(0, 0, 0, 0.78);
            z-index: 120;

            pointer-events: auto;
        }

        #pantalla-pausa.visible {
            display: flex;
        }

        #caja-pausa {
            text-align: center;
            color: white;

            background: rgba(20, 20, 20, 0.96);
            border: 2px solid white;
            border-radius: 18px;

            padding: 45px 60px;
            box-shadow: 0 0 35px rgba(255, 255, 255, 0.35);
        }

        #caja-pausa h1 {
            margin: 0 0 20px 0;
            font-size: 52px;
            color: white;
            letter-spacing: 3px;
            text-shadow: 0 0 12px black;
        }

        #caja-pausa p {
            font-size: 22px;
            margin-bottom: 35px;
        }

        .botones-pausa {
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        #btn-reiniciar-pausa,
        #btn-salir-pausa {
            padding: 15px 35px;

            border: none;
            border-radius: 10px;

            color: white;

            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
        }

        #btn-reiniciar-pausa {
            background: red;
        }

        #btn-reiniciar-pausa:hover {
            background: darkred;
        }

        #btn-salir-pausa {
            background: #333333;
        }

        #btn-salir-pausa:hover {
            background: #555555;
        }
    </style>
</head>

<body>

    <div id="hud">

        <!-- HUESOS ARRIBA IZQUIERDA -->
        <div id="contador-huesos">
            <img src="img/hueso.png" alt="Hueso">
            <strong id="hud-huesos">0</strong>
        </div>

        <!-- TEMPORIZADOR ABAJO IZQUIERDA -->
        <div id="temporizador">05:00</div>

        <!-- PICKUPS ABAJO EN MEDIO -->
        <div id="barra-pickups">

            <div class="pickup" id="pickup-llave">
                <img src="img/llave.png" alt="Llave">
            </div>

            <div class="pickup" id="pickup-reloj">
                <img src="img/reloj.png" alt="Reloj">
            </div>

            <div class="pickup" id="pickup-pocion">
                <img src="img/pocion.png" alt="Poción">
            </div>

        </div>

        <!-- PANTALLA DE PARTIDA ACABADA -->
        <div id="pantalla-game-over">
            <div id="caja-game-over">
                <h1>PARTIDA ACABADA</h1>
                <p>NO HAS LOGRADO SALIR DEL LABERINTO</p>
                <button id="btn-reintentar">VOLVER A INTENTARLO</button>
            </div>
        </div>

        <!-- PANTALLA DE PAUSA -->
        <div id="pantalla-pausa">
            <div id="caja-pausa">
                <h1>PAUSA</h1>
                <p>Pulsa ESC para volver a la partida</p>

                <div class="botones-pausa">
                    <button id="btn-reiniciar-pausa">REINICIAR</button>
                    <button id="btn-salir-pausa">SALIR</button>
                </div>
            </div>
        </div>


    </div>

    <div id="WebGL-output"></div>

</body>

</html>
